services:
  - type: web
    name: jarvis-ecosystem
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemini-2.5-flash
      - key: ACTIVATE_TELEGRAM_WEBHOOK_REPLACEMENT
        value: "true"
      - key: CARTESIA_API_KEY
        sync: false
      - key: VOICE_NAME
        value: mcu_jarvis
      - key: BOT_OWNER_ID
        sync: false
      - key: NODE_ENV
        value: production
